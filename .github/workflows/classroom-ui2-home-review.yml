name: Classroom UI2 home and HUD candidate
on:
  pull_request:
    paths: ['seating/index.html','classroom/host/manager-home.*','classroom/host/class-bootstrap.js','classroom/host/grade-mount.js','classroom/tests/browser-ui2-home.cjs','classroom/tests/browser-ui2-theme.cjs','classroom/tests/hoja-theme.test.cjs','shared/hoja-*','classroom/tests/browser-ui2-surfaces.cjs','classroom/grades/manager-theme-icons-init.js','classroom/host/board-view.js','classroom/host/manager-theme.js','classroom/grades/manager-theme-frame.js','classroom/grades/index.html','runtime-src/system/dashboard.html','runtime-src/system/server.ps1','classroom/tests/board-theme-*','classroom/tests/browser-ui2-sync.cjs','classroom/host/manager-theme-cloud.mjs','classroom/tests/theme-cloud.test.mjs','classroom/tests/browser-ui2-google-theme.cjs','.github/workflows/classroom-ui2-home-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          node --check shared/hoja-theme.js
          node --check classroom/host/manager-theme.js
          node --test classroom/tests/hoja-theme.test.cjs classroom/tests/theme-cloud.test.mjs
          node classroom/tests/board-theme-publish.test.cjs
          pwsh -NoProfile -File classroom/tests/board-theme-server.test.ps1
          pwsh -NoProfile -File classroom/tests/board-roster-server.test.ps1
          node --check classroom/host/manager-home.js
          node --check classroom/host/class-bootstrap.js
          node --check classroom/host/grade-mount.js
          node classroom/tests/manager-board-only.test.cjs
          node --test classroom/tests/mount-contract.test.mjs
          npm install --prefix /tmp/tt-ui2-browser --no-audit --no-fund --no-package-lock playwright@1.55.0
          NODE_PATH=/tmp/tt-ui2-browser/node_modules node classroom/tests/browser-ui2-home.cjs
          NODE_PATH=/tmp/tt-ui2-browser/node_modules node classroom/tests/browser-ui2-theme.cjs
          NODE_PATH=/tmp/tt-ui2-browser/node_modules node classroom/tests/browser-ui2-sync.cjs
          NODE_PATH=/tmp/tt-ui2-browser/node_modules node classroom/tests/browser-ui2-google-theme.cjs
          NODE_PATH=/tmp/tt-ui2-browser/node_modules node classroom/tests/browser-ui2-surfaces.cjs

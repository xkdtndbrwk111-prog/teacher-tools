name: Classroom UI2 home and HUD candidate
on:
  pull_request:
    paths: ['seating/index.html','classroom/host/manager-home.*','classroom/host/class-bootstrap.js','classroom/host/grade-mount.js','classroom/tests/browser-ui2-home.cjs','.github/workflows/classroom-ui2-home-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          node --check classroom/host/manager-home.js
          node --check classroom/host/class-bootstrap.js
          node --check classroom/host/grade-mount.js
          node classroom/tests/manager-board-only.test.cjs
          node --test classroom/tests/mount-contract.test.mjs
          npm install --prefix /tmp/tt-ui2-browser --no-audit --no-fund --no-package-lock playwright@1.55.0
          NODE_PATH=/tmp/tt-ui2-browser/node_modules node classroom/tests/browser-ui2-home.cjs

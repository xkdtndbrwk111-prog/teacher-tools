name: Stage V1.66.27 PE presentation payload
on:
  push:
    branches: [release/v1.66.27-pe-team-zones]
    paths: [.github/workflows/r8-v16627-stage.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Reuse only exact, verified R7 Windows integration package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14738562122/zip" \
            --output "$RUNNER_TEMP/verified-r7-artifact.zip"
          unzip -p "$RUNNER_TEMP/verified-r7-artifact.zip" \
            'tmp/tt-presentation/presentation-assets.zip' \
            > runtime-src/system/presentation-assets.zip
          printf '%s  %s\n' \
            'db73aa0f086b2e1c177be115c2926e1858015ba2cf73ff0ac833d3efa088f027' \
            runtime-src/system/presentation-assets.zip | sha256sum --check
          python - <<'PY'
          import io,zipfile,pathlib
          p=pathlib.Path('runtime-src/system/presentation-assets.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              src=z.read('seating/pe-v1.js').decode('utf-8')
              assert 'function drawPEPitchTeamZones(' in src
              assert '.pe-team .pe-member strong' in src
              assert 'drawPEPitchTeamZones(ctx,plan,f);' in src
          print('PASS: exact signed-source candidate input; verified PE zone and contrast code')
          PY
      - name: Set next runtime version only; keep all other programs untouched
        run: |
          python - <<'PY'
          import json,pathlib,re
          p=pathlib.Path('runtime-src/system/release.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['version']=='1.66.26' and d['channel']=='stable' and d['updateMode']=='auto-pilot'
          d['version']='1.66.27'
          d['release']='2026-11-22-V1.66.27-PE-TEAM-ZONES-STABLE-PILOT'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=pathlib.Path('runtime-src/system/dashboard.html')
          raw=p.read_bytes()
          updated,n=re.subn(rb'(?<![\d.])1\.66\.26(?![\d.])',b'1.66.27',raw)
          if n: p.write_bytes(updated)
          print('Dashboard visible release labels updated:',n)
          PY
      - name: Commit staged source on this branch, never publish a feed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime-src/system/presentation-assets.zip runtime-src/system/release.json runtime-src/system/dashboard.html
          git diff --cached --check
          git diff --cached --quiet && { echo 'No staged changes'; exit 1; }
          git commit -m "build(r8): stage V1.66.27 verified PE presentation runtime"
          git push origin "HEAD:release/v1.66.27-pe-team-zones"

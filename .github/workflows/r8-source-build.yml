name: R8 source-driven build
on:
  pull_request:
    paths: ['runtime-src/system/**','tools/r8-publisher/**','.github/workflows/r8-source-build.yml']
  push:
    branches: [main]
    paths: ['runtime-src/system/**','tools/r8-publisher/**','.github/workflows/r8-source-build.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate publisher and approval ancestry
        run: python tools/r8-publisher/test-publisher.py -v
      - name: Build full snapshot from committed program sources
        run: |
          set -euo pipefail
          python tools/r8-publisher/source-build.py build runtime-src/system stable/runtime-v1/latest.json "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: candidate
        with:
          name: r8-runtime-release-candidate
          path: ${{ runner.temp }}/candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Report release inputs
        env:
          ID: ${{ steps.candidate.outputs.artifact-id }}
          DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: |
          echo "artifact_id=$ID"
          echo "archive_sha=$DIGEST"
          echo "payload_sha=$(sha256sum "$RUNNER_TEMP/candidate/payload.json" | cut -d ' ' -f1)"
          echo 'Unsigned only. Field approval and existing independent signer/publisher still required.'

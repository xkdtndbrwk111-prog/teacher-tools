name: HOJA WebView2 isolated Windows lab
on:
  pull_request:
    paths: ['tools/webview-lab/**','.github/workflows/hoja-webview-lab.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 734e494fad3c81033a786b4b7a5acc5c3ebcd424
          path: reviewed-kernel
          persist-credentials: false
          sparse-checkout: tools/r8-updater/runtime
      - name: Install pinned browser test driver
        shell: powershell
        run: |
          npm install --prefix "$env:RUNNER_TEMP/hoja-lab-node" --no-audit --no-fund --no-package-lock playwright@1.55.0
          if($LASTEXITCODE -ne 0){throw 'Playwright installation failed'}
          "NODE_PATH=$env:RUNNER_TEMP/hoja-lab-node/node_modules" >> $env:GITHUB_ENV
      - name: Compile native WinForms host and verify actual isolated board
        shell: powershell
        run: tools/webview-lab/build-test.ps1
  book-reader:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify pinned original reader in independent clean Windows runner
        shell: powershell
        run: tools/webview-lab/book-reader-self-test.ps1
  phase5-gate:
    name: Phase 5D integrated regression gate (lab only)
    needs: [native, book-reader]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 3
    env:
      NATIVE_RESULT: ${{ needs.native.result }}
      READER_RESULT: ${{ needs.book-reader.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify original dashboard, legacy worker and pinned reader unchanged
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dashboard=git rev-parse HEAD:runtime-src/system/dashboard.html
          $server=git rev-parse HEAD:runtime-src/system/server.ps1
          if($dashboard -cne '3c9d702891313920c5fb1fb6e26b97b30a04d2d4'){throw 'Original dashboard drift'}
          if($server -cne 'aca1c8b88560c51b967134293d9d951c167cf0e0'){throw 'Original worker drift'}
          if((Get-FileHash runtime-src/system/asset-book-reader-host.zip -Algorithm SHA256).Hash.ToLowerInvariant() -cne '20666e7d2c9fc7e28c89f4827258dbcd145f0f39176ea5d16335db8f4b473f6c'){throw 'Original reader drift'}
          if($env:NATIVE_RESULT -ne 'success' -or $env:READER_RESULT -ne 'success'){throw "Phase 5D blocked: native=$env:NATIVE_RESULT reader=$env:READER_RESULT"}
          Write-Host 'PASS Phase 5D isolated regression: native board, manager, ledger, book, meeting, media, rollback and pinned original sources'
          Write-Host 'FIELD GATES REMAIN: actual Canva/account, actual external video download, physical display/input/audio and installed production candidate'
  field-pilot:
    name: Phase 6A isolated installable field pilot
    needs: [phase5-gate]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build separate field pilot
        shell: powershell
        run: tools/webview-lab/field-pilot-build.ps1
      - name: Install and launch in separate test user data directory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $package=Join-Path $env:RUNNER_TEMP 'HOJA-WebView2-FieldPilot-A1'
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP ('field-pilot-smoke-'+[guid]::NewGuid().ToString('N'))
          $legacy=Join-Path $env:LOCALAPPDATA 'TeacherToolsLocal'
          New-Item -ItemType Directory -Path $legacy -Force|Out-Null
          Set-Content -LiteralPath (Join-Path $legacy 'keep.txt') 'untouched' -Encoding ASCII
          $hash=(Get-FileHash (Join-Path $legacy 'keep.txt')).Hash
          & (Join-Path $package 'Start-Pilot.ps1') -Smoke
          & (Join-Path $package 'Start-Pilot.ps1') -Smoke -Mode wallpaper
          if((Get-FileHash (Join-Path $legacy 'keep.txt')).Hash -cne $hash -or @(Get-ChildItem $legacy -Force).Count -ne 1){throw 'Existing installation changed'}
          if(Get-NetTCPConnection -LocalPort 17451 -State Listen -ErrorAction SilentlyContinue){throw 'Pilot listener survived close'}
          $original=Join-Path $package 'payload/local/TeacherToolsLocal/release.json'
          $bytes=[IO.File]::ReadAllBytes($original)
          try{
            [IO.File]::WriteAllText($original,'tampered')
            $rejected=$false
            try{& (Join-Path $package 'Start-Pilot.ps1') -Smoke}catch{if($_.Exception.Message -notmatch 'Package file mismatch'){throw};$rejected=$true}
            if(!$rejected){throw 'Tampered package accepted'}
          }finally{[IO.File]::WriteAllBytes($original,$bytes)}
          Write-Host 'PASS pilot manual installation, window/wallpaper close and reopen, legacy directory untouched, tamper rejection'
      - name: Upload verified field pilot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HOJA-WebView2-FieldPilot-A1
          path: ${{ runner.temp }}/HOJA-WebView2-FieldPilot-A1
          if-no-files-found: error
          retention-days: 14

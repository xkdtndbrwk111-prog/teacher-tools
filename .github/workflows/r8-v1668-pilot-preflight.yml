name: R8 V1.66.8 pilot preflight
on:
  pull_request:
    paths: ['runtime-src/v1668-pilot-approval.json','tools/r8-publisher/check-v1668-pilot.py','.github/workflows/r8-v1668-pilot*.yml','.github/workflows/r8-runtime-release.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python tools/r8-publisher/test-approval.py -v
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/r8-publisher/check-v1668-pilot.py

name: Canva book direct signal research
on:
  pull_request:
    paths: ['tools/multimedia/canva-signal-probe.cjs','.github/workflows/canva-book-signal-research.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          npm install --prefix /tmp/canva-probe --no-audit --no-fund --no-package-lock playwright@1.55.0 pngjs@7.0.0
          /tmp/canva-probe/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/canva-probe/node_modules node tools/multimedia/canva-signal-probe.cjs

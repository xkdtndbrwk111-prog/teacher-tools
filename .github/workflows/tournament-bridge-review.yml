name: Tournament host bridge review
on:
  push:
    branches: [codex/tournament-bridge-v1, main]
    paths: ['runtime-src/system/**','tools/tournament-bridge/**','.github/workflows/tournament-bridge-review.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          node --check runtime-src/system/coins.js
          node --check runtime-src/system/coins-ui.js
          node --test tools/tournament-bridge/test.cjs

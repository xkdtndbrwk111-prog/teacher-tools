name: V1.66.19 live feed verification
on:
  pull_request:
    paths: ['.github/workflows/r8-v16619-evidence.yml']
permissions:
  contents: read
  pages: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify exact hosted signed manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '{status,commit,error}'
          url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)"
          case "$url" in https://*) ;; *) exit 1;; esac
          curl -fsSL --max-time 20 "${url%/}/stable/runtime-v1/latest.json?fresh=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/live.json"
          python -c 'import json,base64,hashlib,sys; feed=json.load(open(sys.argv[1])); payload=base64.b64decode(feed["payload"]); assert json.loads(payload)["version"]=="1.66.19"; assert hashlib.sha256(payload).hexdigest()=="ddb0224f5a07c68c118c50232839de115d7c0329ef321e0cbc654303d57baa75"; assert len(base64.b64decode(feed["signature"]))==256; print("PASS live Pages V1.66.19 exact approved payload and signature present")' "$RUNNER_TEMP/live.json"

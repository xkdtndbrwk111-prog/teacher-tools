name: Multimedia candidate browser review
on:
  pull_request:
    paths: ['runtime-src/system/**','tools/multimedia/**','.github/workflows/multimedia-review.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          npm install --prefix /tmp/tt-mm --no-audit --no-fund --no-package-lock playwright@1.55.0
          /tmp/tt-mm/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/tt-mm/node_modules node tools/multimedia/browser.cjs

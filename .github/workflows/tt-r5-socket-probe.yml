name: R5 Windows PowerShell 5.1 socket lifetime probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/tt-r5-socket-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  socket:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Verify socket inheritance flags and rebinding while updater child is alive
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Windows PowerShell 5.1 required'}
          $root=Join-Path $env:RUNNER_TEMP 'tt-socket-probe'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $serverPath=Join-Path $root 'server.ps1'
          @'
          param([string]$Root)
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition @"
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class TTSocketHandleGuard {
              private const uint HANDLE_FLAG_INHERIT = 1;
              [DllImport("kernel32.dll", SetLastError=true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool SetHandleInformation(IntPtr handle, uint mask, uint flags);
              [DllImport("kernel32.dll", SetLastError=true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool GetHandleInformation(IntPtr handle, out uint flags);
              public static void MakeNonInheritable(IntPtr handle) {
                  if (!SetHandleInformation(handle, HANDLE_FLAG_INHERIT, 0))
                      throw new Win32Exception(Marshal.GetLastWin32Error());
                  uint flags;
                  if (!GetHandleInformation(handle, out flags))
                      throw new Win32Exception(Marshal.GetLastWin32Error());
                  if ((flags & HANDLE_FLAG_INHERIT) != 0)
                      throw new InvalidOperationException("Teacher Tools socket is inheritable.");
              }
          }
          "@
          $listener=New-Object System.Net.Sockets.TcpListener([Net.IPAddress]::Loopback,0)
          try {
            [TTSocketHandleGuard]::MakeNonInheritable($listener.Server.Handle)
            $listener.Start()
            [TTSocketHandleGuard]::MakeNonInheritable($listener.Server.Handle)
            [IO.File]::WriteAllText((Join-Path $Root 'port.txt'),([string]$listener.LocalEndpoint.Port))
            $client=$listener.AcceptTcpClient()
            try {
              [TTSocketHandleGuard]::MakeNonInheritable($client.Client.Handle)
              $info=New-Object Diagnostics.ProcessStartInfo
              $info.FileName=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
              $info.Arguments='-NoProfile -Command "Start-Sleep -Seconds 60"'
              $info.UseShellExecute=$false
              $info.CreateNoWindow=$true
              $child=[Diagnostics.Process]::Start($info)
              [IO.File]::WriteAllText((Join-Path $Root 'child.txt'),([string]$child.Id))
              Start-Sleep -Seconds 65
            }finally{$client.Close()}
          }finally{$listener.Stop()}
          '@ | Set-Content -LiteralPath $serverPath -Encoding UTF8
          $p=$null;$child=$null;$connection=$null;$rebound=$null
          function Wait-TextFile([string]$path){
            for($i=0;$i -lt 120;$i++){if(Test-Path -LiteralPath $path){$v=(Get-Content -LiteralPath $path -Raw).Trim();if($v){return $v}};Start-Sleep -Milliseconds 250}
            throw "Missing probe marker: $path"
          }
          $info=New-Object Diagnostics.ProcessStartInfo
          $info.FileName=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $info.Arguments='-NoProfile -File "'+$serverPath+'" -Root "'+$root+'"'
          $info.UseShellExecute=$false;$info.CreateNoWindow=$true
          try {
            $p=[Diagnostics.Process]::Start($info)
            $port=[int](Wait-TextFile (Join-Path $root 'port.txt'))
            $connection=New-Object Net.Sockets.TcpClient
            $connection.Connect([Net.IPAddress]::Loopback,$port)
            $child=Get-Process -Id ([int](Wait-TextFile (Join-Path $root 'child.txt')))
            $null=$p.Handle
            if($p.HasExited -or $child.HasExited){throw 'Probe processes did not remain alive'}
            $p.Kill()
            if(-not $p.WaitForExit(45000)){throw 'Server did not exit'}
            $p.Dispose();$p=$null
            $connection.Close();$connection=$null
            $ok=$false
            for($i=0;$i -lt 40;$i++){
              $rebound=New-Object Net.Sockets.TcpListener([Net.IPAddress]::Loopback,$port)
              try{$rebound.Start();$ok=$true;break}catch{$rebound.Stop();$rebound=$null;Start-Sleep -Milliseconds 250}
            }
            if(-not $ok){throw 'Port could not be rebound while updater remained alive'}
            if($child.HasExited){throw 'Updater exited too early; probe invalid'}
            Write-Host 'PASS: Windows PS5.1 listener and accepted socket marked non-inheritable; verified server process terminated; same port rebound with spawned updater child still running.'
          }finally{
            if($rebound){$rebound.Stop()};if($connection){$connection.Close()}
            if($p){if(-not $p.HasExited){$p.Kill()};$p.Dispose()}
            if($child){if(-not $child.HasExited){$child.Kill()};$child.Dispose()}
          }

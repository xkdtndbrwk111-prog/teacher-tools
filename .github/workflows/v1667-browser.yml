name: V1.66.7 theme font shadow and icon regressions
on:
  pull_request:
    paths: ['runtime-src/system/**','tools/v1667/browser.cjs','.github/workflows/v1667-browser.yml']
  push:
    branches: [main, codex/v1667-ui-light-weather]
    paths: ['runtime-src/system/**','tools/v1667/browser.cjs','.github/workflows/v1667-browser.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          npm install --prefix /tmp/tt-v1667 --no-audit --no-fund --no-package-lock playwright@1.55.0
          /tmp/tt-v1667/node_modules/.bin/playwright install chromium
          NODE_PATH=/tmp/tt-v1667/node_modules node tools/v1667/browser.cjs

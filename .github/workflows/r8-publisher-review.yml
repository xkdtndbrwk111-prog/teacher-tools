name: R8 publisher contract review
on:
  push:
    branches: [codex/r8-release-pipeline, main]
    paths: ['tools/r8-publisher/**','.github/workflows/r8-publisher-review.yml','.github/workflows/r8-runtime-release.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python tools/r8-publisher/test-publisher.py -v
          python -m py_compile tools/r8-publisher/validate.py

name: V1.64 signed migration candidate (no publish)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tt-v164-migration-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: teacher-tools-signing
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 39ed38416cdbd02a31b54fa462294e91a0c313de
          persist-credentials: false
      - name: Verify old signature and build isolated candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath 'stable/content-v3/latest.json' -Raw | ConvertFrom-Json
          $raw = [Convert]::FromBase64String(($source.payloadChunks -join ''))
          $old = [System.Security.Cryptography.RSA]::Create()
          try {
            $p = [System.Security.Cryptography.RSAParameters]::new()
            $p.Modulus = [Convert]::FromBase64String('')
            $p.Exponent = [Convert]::FromBase64String('AQAB')
            $old.ImportParameters($p)
            if (-not $old.VerifyData($raw,[Convert]::FromBase64String($source.signature),[System.Security.Cryptography.HashAlgorithmName]::SHA256,[System.Security.Cryptography.RSASignaturePadding]::Pkcs1)) { throw 'Original V1.63.5 signature invalid' }
          } finally { $old.Dispose() }
          $dir = Join-Path $env:RUNNER_TEMP 'tt-v164-candidate'
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dir 'source-payload.json'),$raw)
          @'
          import base64, gzip, hashlib, io, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          sha = lambda b: hashlib.sha256(b).hexdigest()
          enc = lambda b: base64.b64encode(b).decode('ascii')
          raw = (root/'source-payload.json').read_bytes()
          assert sha(raw) == '89e0e8373ebd74e31e7f8334eb7ff0fd58aeacebb6ef21b9494f05040afeef8e'
          source = json.loads(raw)
          assert source['schema']=='TT-STABLE-CONTENT-SNAPSHOT-3' and source['channel']=='stable' and source['toVersion']=='1.63.5'
          with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(source['htmlGzip'],validate=True))) as f:
              html = f.read(16*1024*1024+1)
          rel = base64.b64decode(source['releaseBytes'],validate=True)
          assert 0<len(html)<=16*1024*1024
          assert sha(html)==source['afterHtmlSha']=='27f8c326afbaae0783a49fd4305eeff95a15a0928909049ce6a5401a5d95410c'
          assert sha(rel)==source['afterReleaseSha']=='00a58f0e43a7687315b6718fcf776d664053c027ab7be4f825cfc7d72447ade6'
          old=json.loads(rel)
          assert old['version']=='1.63.5' and old['channel']=='stable' and old['updateMode']=='auto-pilot' and old['audience']=='owner-field-test'
          assert b'V1.63.5 STABLE PILOT' in html
          count=html.count(b'1.63.5')
          assert 1<=count<=30
          new_html=html.replace(b'1.63.5',b'1.64.0')
          new_rel=rel.replace(b'1.63.5',b'1.64.0')
          assert new_html.replace(b'1.64.0',b'1.63.5')==html
          assert new_rel.replace(b'1.64.0',b'1.63.5')==rel
          assert b'V1.64.0 STABLE PILOT' in new_html
          new=json.loads(new_rel)
          assert new['version']=='1.64.0' and new['release'].endswith('-V1.64.0-STABLE-PILOT')
          target={'schema':'TT-STABLE-CONTENT-SNAPSHOT-3','channel':'stable','toVersion':'1.64.0','bases':[{'version':'1.63.5','htmlSha':sha(html),'releaseSha':sha(rel)}],'afterHtmlSha':sha(new_html),'afterReleaseSha':sha(new_rel),'releaseBytes':enc(new_rel),'htmlGzip':enc(gzip.compress(new_html,mtime=0))}
          (root/'dashboard-1.63.5.html').write_bytes(html)
          (root/'release-1.63.5.json').write_bytes(rel)
          (root/'dashboard-1.64.0.html').write_bytes(new_html)
          (root/'release-1.64.0.json').write_bytes(new_rel)
          (root/'candidate-payload.json').write_bytes(json.dumps(target,separators=(',',':')).encode('utf-8'))
          (root/'source-payload.json').unlink()
          print('PASS: old signed content verified; migration candidate changes version text only; replacements=',count)
          '@ | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'tt-build.py') -Encoding utf8
          python (Join-Path $env:RUNNER_TEMP 'tt-build.py') $dir
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
      - name: Sign candidate using approved V2 key
        shell: pwsh
        env:
          TT_PFX: ${{ secrets.TT_SIGNING_PFX_B64 }}
          TT_PASSWORD: ${{ secrets.TT_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cert=$null; $signer=$null; $verifier=$null; $bytes=$null
          try {
            if ([string]::IsNullOrWhiteSpace($env:TT_PFX) -or [string]::IsNullOrEmpty($env:TT_PASSWORD)) { throw 'Missing secret' }
            $bytes=[Convert]::FromBase64String($env:TT_PFX)
            $cert=[System.Security.Cryptography.X509Certificates.X509Certificate2]::new($bytes,$env:TT_PASSWORD,[System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            if ($cert.GetCertHashString([System.Security.Cryptography.HashAlgorithmName]::SHA256).ToLowerInvariant() -ne '0e0e1b970de3d8e16c721ea170f947f9d0cfcda34eca24e8a324ba29b55497cd' -or -not $cert.HasPrivateKey) { throw 'Unexpected signing certificate' }
            $signer=[System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($cert)
            $verifier=[System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($cert)
            if ($signer.KeySize -ne 2048) { throw 'Unexpected key size' }
            $dir=Join-Path $env:RUNNER_TEMP 'tt-v164-candidate'
            $raw=[IO.File]::ReadAllBytes((Join-Path $dir 'candidate-payload.json'))
            $hash=[System.Security.Cryptography.HashAlgorithmName]::SHA256
            $pad=[System.Security.Cryptography.RSASignaturePadding]::Pkcs1
            $sig=$signer.SignData($raw,$hash,$pad)
            if ($sig.Length -ne 256 -or -not $verifier.VerifyData($raw,$sig,$hash,$pad)) { throw 'Signature invalid' }
            $bad=[byte[]]$raw.Clone(); $bad[0]=$bad[0] -bxor 1
            if ($verifier.VerifyData($bad,$sig,$hash,$pad)) { throw 'Tamper accepted' }
            $b64=[Convert]::ToBase64String($raw)
            $chunks=@(for($i=0;$i -lt $b64.Length;$i+=6000){$b64.Substring($i,[Math]::Min(6000,$b64.Length-$i))})
            $json=@{payloadChunks=$chunks;signature=[Convert]::ToBase64String($sig)} | ConvertTo-Json -Compress -Depth 4
            [IO.File]::WriteAllText((Join-Path $dir 'latest-v2-candidate.json'),$json,[Text.UTF8Encoding]::new($false))
            Remove-Item -LiteralPath (Join-Path $dir 'candidate-payload.json')
            Write-Host 'PASS: candidate signed by V2 key, signature verified, tamper rejected. No repository or feed write.'
          } catch {
            Write-Host '::error::V2 candidate signing failed; sensitive details suppressed.'
            exit 1
          } finally {
            if ($signer) { $signer.Dispose() }; if ($verifier) { $verifier.Dispose() }; if ($cert) { $cert.Dispose() }
            if ($bytes) { [Array]::Clear($bytes,0,$bytes.Length) }
            Remove-Item Env:TT_PFX,Env:TT_PASSWORD -ErrorAction SilentlyContinue
          }
      - name: Retain public candidate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tt-v164-public-migration-candidate
          path: ${{ runner.temp }}/tt-v164-candidate
          retention-days: 3
          if-no-files-found: error

name: R8 verified runtime release
on:
  workflow_call:
    inputs:
      artifact_id:
        required: true
        type: string
      archive_sha:
        required: true
        type: string
      payload_sha:
        required: true
        type: string
      field_gate:
        required: true
        type: boolean
      first_pilot:
        required: false
        default: false
        type: boolean
      owner_pilot_1666:
        required: false
        default: false
        type: boolean
      owner_pilot_1667:
        required: false
        default: false
        type: boolean
      owner_pilot_1668:
        required: false
        default: false
        type: boolean
      owner_pilot_1669:
        required: false
        default: false
        type: boolean
    secrets:
      TT_SIGNING_PFX_B64:
        required: false
      TT_SIGNING_PFX_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      artifact_id:
        description: "Verified candidate Actions artifact ID (payload.json and blobs/ only)"
        required: true
        type: string
      archive_sha:
        description: "Exact SHA-256 of candidate artifact ZIP"
        required: true
        type: string
      payload_sha:
        description: "Exact SHA-256 of approved manifest payload"
        required: true
        type: string
      field_gate:
        description: "Windows install, update, rollback and R7 integration field checks passed"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: r8-runtime-release
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main' && (inputs.field_gate == true || (inputs.first_pilot == true && inputs.field_gate == false && inputs.artifact_id == '14299231514' && inputs.archive_sha == 'b8810ce788b75959e9f020c704b76ccdf251c34540f1fc5d76e31307687aa47e' && inputs.payload_sha == 'c3d60c5401579adc3d1e5500979c7a3ef2cc1c827e3ed8a76965fd1c4b89e0d6') || (inputs.owner_pilot_1666 == true && inputs.field_gate == false && inputs.first_pilot != true && inputs.artifact_id == '14307406730' && inputs.archive_sha == '0f9ef84d6d60a9972857710abdf450b2cb95b33d86cb96229a74ff6d28c7c8ef' && inputs.payload_sha == '49152598c67a70055afe007c9aeeb22106839bd8101bdd56dbac38b6a84f4365') || (inputs.owner_pilot_1667 == true && inputs.field_gate == false && inputs.first_pilot != true && inputs.owner_pilot_1666 != true && inputs.artifact_id == '14308925891' && inputs.archive_sha == '309a5ec31b3be25de0ca0f5ff0567ec705fa3ce3555661d2d3fd73d59f79cf25' && inputs.payload_sha == 'b65f12a4fc5f97c8df0e09835596890136cdef66ea095a220aacec9311fb56be') || (inputs.owner_pilot_1668 == true && inputs.field_gate == false && inputs.first_pilot != true && inputs.owner_pilot_1666 != true && inputs.owner_pilot_1667 != true && inputs.artifact_id == '14309515704' && inputs.archive_sha == '9933e29c1e20f4381090ca30ad86061b8662991791f5cdff8b38e8240c35cd95' && inputs.payload_sha == '70fec73cd236fd31e5570e32ef7de4dab45ed9b1ec543356632f6efa9d8eb96b') || (inputs.owner_pilot_1669 == true && inputs.field_gate == false && inputs.first_pilot != true && inputs.owner_pilot_1666 != true && inputs.owner_pilot_1667 != true && inputs.owner_pilot_1668 != true && inputs.artifact_id == '14312839293' && inputs.archive_sha == '1da27aafdf9b02fcbf2794773a0b943583ce2c57b6a67b1d7134a3ffa16738a8' && inputs.payload_sha == '20047d60796719d183f95e9728f21af8621a5a7ebd027fea30febc885b9b2300'))
    runs-on: windows-latest
    environment: teacher-tools-signing
    timeout-minutes: 10
    outputs:
      old_sha: ${{ steps.check.outputs.old_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact archive and payload validation (no key)
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_PILOT: ${{ inputs.first_pilot }}
          OWNER_PILOT_1666: ${{ inputs.owner_pilot_1666 }}
          OWNER_PILOT_1667: ${{ inputs.owner_pilot_1667 }}
          OWNER_PILOT_1668: ${{ inputs.owner_pilot_1668 }}
          OWNER_PILOT_1669: ${{ inputs.owner_pilot_1669 }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARCHIVE_SHA: ${{ inputs.archive_sha }}
          PAYLOAD_SHA: ${{ inputs.payload_sha }}
        run: |
          $ErrorActionPreference='Stop'
          # Use the committed bytes, not Windows checkout newline conversion.
          python -c "import pathlib,subprocess; p=pathlib.Path('stable/runtime-v1/latest.json'); p.write_bytes(subprocess.check_output(['git','show','HEAD:'+p.as_posix()]))"
          if($LASTEXITCODE -ne 0){throw 'Exact old feed extraction failed'}
          if($env:ARTIFACT_ID -cnotmatch '^[0-9]{1,20}$' -or $env:ARCHIVE_SHA -cnotmatch '^[a-f0-9]{64}$' -or $env:PAYLOAD_SHA -cnotmatch '^[a-f0-9]{64}$'){throw 'Invalid release inputs'}
          if($env:FIRST_PILOT -eq 'true'){
            if((Get-Content -Raw stable/runtime-v1/latest.json | ConvertFrom-Json).status -cne 'unreleased'){throw 'First pilot authorization cannot be reused'}
            if($env:ARTIFACT_ID -cne '14299231514' -or $env:ARCHIVE_SHA -cne 'b8810ce788b75959e9f020c704b76ccdf251c34540f1fc5d76e31307687aa47e' -or $env:PAYLOAD_SHA -cne 'c3d60c5401579adc3d1e5500979c7a3ef2cc1c827e3ed8a76965fd1c4b89e0d6'){throw 'First pilot exact candidate required'}
          }
          if($env:OWNER_PILOT_1666 -eq 'true'){
            if($env:ARTIFACT_ID -cne '14307406730' -or $env:ARCHIVE_SHA -cne '0f9ef84d6d60a9972857710abdf450b2cb95b33d86cb96229a74ff6d28c7c8ef' -or $env:PAYLOAD_SHA -cne '49152598c67a70055afe007c9aeeb22106839bd8101bdd56dbac38b6a84f4365'){throw 'Exact V1.66.6 pilot candidate required'}
            python -c "import sys,pathlib,hashlib,json; sys.path.insert(0,'tools/r8-publisher'); import validate as v; b=v.decode_feed(pathlib.Path('stable/runtime-v1/latest.json').read_bytes()); assert hashlib.sha256(b).hexdigest()=='c3d60c5401579adc3d1e5500979c7a3ef2cc1c827e3ed8a76965fd1c4b89e0d6' and json.loads(b)['version']=='1.66.5','Pilot previous feed mismatch'"
            if($LASTEXITCODE -ne 0){throw 'V1.66.6 pilot requires the exact signed V1.66.5 live feed'}
          }
          if($env:OWNER_PILOT_1667 -eq 'true'){
            if($env:ARTIFACT_ID -cne '14308925891' -or $env:ARCHIVE_SHA -cne '309a5ec31b3be25de0ca0f5ff0567ec705fa3ce3555661d2d3fd73d59f79cf25' -or $env:PAYLOAD_SHA -cne 'b65f12a4fc5f97c8df0e09835596890136cdef66ea095a220aacec9311fb56be'){throw 'Exact V1.66.7 pilot candidate required'}
            python -c "import sys,pathlib,hashlib,json; sys.path.insert(0,'tools/r8-publisher'); import validate as v; b=v.decode_feed(pathlib.Path('stable/runtime-v1/latest.json').read_bytes()); assert hashlib.sha256(b).hexdigest()=='49152598c67a70055afe007c9aeeb22106839bd8101bdd56dbac38b6a84f4365' and json.loads(b)['version']=='1.66.6','Pilot previous feed mismatch'"
            if($LASTEXITCODE -ne 0){throw 'V1.66.7 pilot requires the exact signed V1.66.6 live feed'}
          }
          if($env:OWNER_PILOT_1668 -eq 'true'){
            if($env:ARTIFACT_ID -cne '14309515704' -or $env:ARCHIVE_SHA -cne '9933e29c1e20f4381090ca30ad86061b8662991791f5cdff8b38e8240c35cd95' -or $env:PAYLOAD_SHA -cne '70fec73cd236fd31e5570e32ef7de4dab45ed9b1ec543356632f6efa9d8eb96b'){throw 'Exact V1.66.8 pilot candidate required'}
            python -c "import sys,pathlib,hashlib,json; sys.path.insert(0,'tools/r8-publisher'); import validate as v; b=v.decode_feed(pathlib.Path('stable/runtime-v1/latest.json').read_bytes()); assert hashlib.sha256(b).hexdigest()=='b65f12a4fc5f97c8df0e09835596890136cdef66ea095a220aacec9311fb56be' and json.loads(b)['version']=='1.66.7','Pilot previous feed mismatch'"
            if($LASTEXITCODE -ne 0){throw 'V1.66.8 pilot requires the exact signed V1.66.7 live feed'}
          }
          if($env:OWNER_PILOT_1669 -eq 'true'){
            if($env:ARTIFACT_ID -cne '14312839293' -or $env:ARCHIVE_SHA -cne '1da27aafdf9b02fcbf2794773a0b943583ce2c57b6a67b1d7134a3ffa16738a8' -or $env:PAYLOAD_SHA -cne '20047d60796719d183f95e9728f21af8621a5a7ebd027fea30febc885b9b2300'){throw 'Exact V1.66.9 pilot candidate required'}
            python -c "import sys,pathlib,hashlib,json; sys.path.insert(0,'tools/r8-publisher'); import validate as v; b=v.decode_feed(pathlib.Path('stable/runtime-v1/latest.json').read_bytes()); assert hashlib.sha256(b).hexdigest()=='70fec73cd236fd31e5570e32ef7de4dab45ed9b1ec543356632f6efa9d8eb96b' and json.loads(b)['version']=='1.66.8','Pilot previous feed mismatch'"
            if($LASTEXITCODE -ne 0){throw 'V1.66.9 pilot requires the exact signed V1.66.8 live feed'}
          }
          $dir=Join-Path $env:RUNNER_TEMP 'r8-release'
          New-Item -ItemType Directory $dir | Out-Null
          $meta=gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $meta.expired -or $meta.name -cne 'r8-runtime-release-candidate'){throw 'Unexpected artifact'}
          $url="https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip"
          Invoke-WebRequest -Uri $url -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -OutFile (Join-Path $dir 'candidate.zip')
          python tools/r8-publisher/validate.py extract (Join-Path $dir 'candidate.zip') (Join-Path $dir 'candidate') $env:ARCHIVE_SHA
          if($LASTEXITCODE -ne 0){throw 'Archive rejected'}
          python tools/r8-publisher/validate.py check (Join-Path $dir 'candidate') stable/runtime-v1/latest.json $env:PAYLOAD_SHA
          if($LASTEXITCODE -ne 0){throw 'Manifest rejected'}
          "old_sha=$((Get-FileHash stable/runtime-v1/latest.json -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Sign exact approved manifest
        shell: pwsh
        env:
          TT_PFX: ${{ secrets.TT_SIGNING_PFX_B64 }}
          TT_PASSWORD: ${{ secrets.TT_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'r8-release'
          & tools/r8-publisher/sign.ps1 (Join-Path $dir 'candidate/payload.json') (Join-Path $dir 'signature.bin')
          if($LASTEXITCODE -ne 0){throw 'Signing failed'}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r8-signed-release
          path: |
            ${{ runner.temp }}/r8-release/candidate.zip
            ${{ runner.temp }}/r8-release/signature.bin
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pages: write
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_SHA: ${{ inputs.archive_sha }}
      PAYLOAD_SHA: ${{ inputs.payload_sha }}
      OLD_SHA: ${{ needs.sign.outputs.old_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Independently verify and atomically publish
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/r8-signed"
          mkdir -p "$dir"
          gh run download "$GITHUB_RUN_ID" --name r8-signed-release --dir "$dir"
          actual="$(sha256sum stable/runtime-v1/latest.json | cut -d ' ' -f1)"
          if [ "$actual" != "$OLD_SHA" ]; then echo "::error::Old feed digest differs from signer ($actual != $OLD_SHA)"; exit 1; fi
          python tools/r8-publisher/validate.py extract "$dir/candidate.zip" "$dir/candidate" "$ARCHIVE_SHA"
          python tools/r8-publisher/validate.py stage "$dir/candidate" "$dir/signature.bin" stable/runtime-v1/latest.json "$PAYLOAD_SHA" stable/runtime-v1
          git add -- stable/runtime-v1/blobs stable/runtime-v1/latest.json
          git diff --cached --name-only | python -c 'import sys,re; p=sys.stdin.read().splitlines(); assert p and all(re.fullmatch(r"stable/runtime-v1/(latest\.json|blobs/[a-f0-9]{64}\.bin)",x) for x in p)'
          git config user.name "teacher-tools-release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish independently verified R8 runtime snapshot"
          git push origin HEAD:main
          echo 'Git commit published atomically; request Pages deployment explicitly.'
      - name: Request Pages build
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          echo 'Pages build requested; verify live feed before announcing availability.'

name: Classroom life guided workflow review
on:
  push:
    branches: [main, codex/life-guided-workflow, codex/life-reconnect-code-vault]
    paths: ['classroom/cloud/**','classroom/tests/code-vault.test.mjs','classroom/host/dashboard-link.js','classroom/tests/manager-board-only.test.cjs','classroom/host/board-status.js','classroom/host/hud-shell.js','classroom/host/settings-window.js','classroom/host/life-mount.js','classroom/host/life-mount.css','classroom/host/class-bootstrap.js','seating/index.html','classroom/tests/browser-life-guided.cjs','.github/workflows/life-guided-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: JS syntax and auth regressions
        run: |
          node --check classroom/cloud/server.mjs
          node --check classroom/cloud/firestore-store.mjs
          node --test classroom/tests/code-vault.test.mjs
          node --check classroom/host/life-mount.js
          node --check classroom/host/class-bootstrap.js
          node classroom/tests/manager-board-only.test.cjs
          node --test classroom/tests/life-cloud*.test.mjs classroom/tests/mount-contract.test.mjs
      - name: Isolated Chromium teacher workflow
        run: |
          npm install --prefix /tmp/tt-life-browser --no-audit --no-fund --no-package-lock playwright@1.55.0
          NODE_PATH=/tmp/tt-life-browser/node_modules node classroom/tests/browser-life-guided.cjs

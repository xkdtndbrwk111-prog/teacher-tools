<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학급생활 설문 · TEST</title><link rel="stylesheet" href="../host/life-mount.css"><link rel="stylesheet" href="./student.css"><script type="module" src="./student.mjs"></script></head><body><main><header><span>TEACHER TOOLS · CLOUD TEST</span><h1>학급생활 설문</h1><p>이 설문은 시험이 아닙니다. 정답이나 오답이 없어요.</p></header><section><h2>학생 로그인</h2><p>선생님이 안내한 학생 번호와 개인 코드 6자리를 입력하세요.</p><form id="login"><label>학생 번호<input name="number" type="number" min="1" max="999" inputmode="numeric" autocomplete="off" required></label><label>개인 코드<input name="code" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label><button>로그인</button></form><button id="logout" type="button" hidden>로그아웃</button></section><p id="status" role="status"></p><section id="surveys" hidden><h2>월별 설문</h2><div id="months"></div><div id="form"></div></section></main></body></html>
